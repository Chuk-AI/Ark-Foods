{% extends "base.html" %} {% block title %}Weather Dashboard{% endblock %} {%
block content %}
<div class="dashboard">
  <div class="header">
    <h1>Weather Dashboard</h1>
    <div class="date-range">
      <input type="date" id="start-date" />
      <input type="date" id="end-date" />
      <button id="filter-date-range">Apply</button>
    </div>
    <select id="city-select">
      <option value="26.4187,-81.4173">Immokalee, FL</option>
      <option value="26.7153,-80.0534">Palm Beach County, FL</option>
      <option value="39.4802,-75.0138">Vineland, NJ</option>
      <option value="42.0086,-86.3614">Sodus, MI</option>
      <option value="25.1721,-107.4795">Sinaloa, Mexico</option>
      <option value="29.2972,-110.3309">Sonora, Mexico</option>
    </select>
    <select id="frequency-select">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
    <select id="temperature-unit">
      <option value="C">Celsius (°C)</option>
      <option value="F">Fahrenheit (°F)</option>
    </select>
  </div>

  <div class="graphs">
    <h2>Graphs</h2>
    <div class="chart-container">
      <!-- Precipitation Chart -->
      <div class="chart">
        <canvas id="precipChart" width="400" height="300"></canvas>
      </div>
      <!-- Temperature Chart -->
      <div class="chart">
        <canvas id="tempChart" width="400" height="300"></canvas>
      </div>
    </div>
    <!-- Ensemble Analysis Chart (Wider, placed below other charts) -->
    <div class="chart-container" style="margin-top: 20px">
      <div class="chart" style="width: 1000px">
        <canvas id="ensembleChart" width="1000" height="300"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Include Chart.js and moment.js for date formatting -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>

<script>
  let precipChartInstance = null;
  let tempChartInstance = null;
  let ensembleChartInstance = null;

  document.addEventListener("DOMContentLoaded", function () {
    const citySelect = document.getElementById("city-select");
    const frequencySelect = document.getElementById("frequency-select");
    const filterButton = document.getElementById("filter-date-range");
    const unitSelect = document.getElementById("temperature-unit");

    citySelect.addEventListener("change", fetchData);
    frequencySelect.addEventListener("change", fetchData);
    filterButton.addEventListener("click", fetchData);
    unitSelect.addEventListener("change", fetchData); // Fetch data and update charts when unit changes
    function formatClimatologyData(climatology, forecastDates) {
      const formattedData = {
        TAVG: [],
        PRECIP: [],
      };

      forecastDates.forEach((date) => {
        const dayKey = date.slice(5); // Extract %m-%d from %Y-%m-%d
        formattedData.TAVG.push(climatology.TAVG[dayKey] || null); // Default to null if no data
        formattedData.PRECIP.push(climatology.PRECIP[dayKey] || null);
      });

      return formattedData;
    }
    // Initial load
    fetchData();

    function fetchData() {
      const latlon = citySelect.value.split(",");
      const frequency = frequencySelect.value;
      const startDate = document.getElementById("start-date").value;
      const endDate = document.getElementById("end-date").value;
      const unit = unitSelect.value;

      let apiUrl = `/api/weather_forecasts?lat=${latlon[0]}&lon=${latlon[1]}&start=${startDate}&end=${endDate}`;

      fetch(apiUrl)
        .then((response) => response.json())
        .then((data) => {
          console.log("Weather data: ", data);

          // Re-format daily climatology data to match forecast dates
          const convertedData = convertTemperatureData(data, unit);
          const formattedClimatology = formatClimatologyData(
            convertedData.daily_climatology,
            convertedData.forecast_data.TAVG.dates
          );

          // Render charts with converted data
          renderCharts({
            ...convertedData,
            daily_climatology: formattedClimatology,
          });
        })
        .catch((error) => {
          console.error("Error fetching weather data: ", error);
        });
    }

    function convertTemperatureData(data, unit) {
      if (!data.forecast_data || !data.daily_climatology) {
        console.error("Temperature data missing from response:", data);
        return data;
      }

      // Convert temperature data from Kelvin to the selected unit (C or F)
      if (unit === "C") {
        if (data.forecast_data.TAVG) {
          data.forecast_data.TAVG.avg = data.forecast_data.TAVG.avg.map(
            (k) => k - 273.15
          );
          data.forecast_data.TAVG.min = data.forecast_data.TAVG.min.map(
            (k) => k - 273.15
          );
          data.forecast_data.TAVG.max = data.forecast_data.TAVG.max.map(
            (k) => k - 273.15
          );
        }
        if (data.daily_climatology.TAVG) {
          data.daily_climatology.TAVG = Object.fromEntries(
            Object.entries(data.daily_climatology.TAVG).map(([key, value]) => [
              key,
              value - 273.15,
            ])
          );
        }
      } else if (unit === "F") {
        if (data.forecast_data.TAVG) {
          data.forecast_data.TAVG.avg = data.forecast_data.TAVG.avg.map(
            (k) => ((k - 273.15) * 9) / 5 + 32
          );
          data.forecast_data.TAVG.min = data.forecast_data.TAVG.min.map(
            (k) => ((k - 273.15) * 9) / 5 + 32
          );
          data.forecast_data.TAVG.max = data.forecast_data.TAVG.max.map(
            (k) => ((k - 273.15) * 9) / 5 + 32
          );
        }
        if (data.daily_climatology.TAVG) {
          data.daily_climatology.TAVG = Object.fromEntries(
            Object.entries(data.daily_climatology.TAVG).map(([key, value]) => [
              key,
              ((value - 273.15) * 9) / 5 + 32,
            ])
          );
        }
      }
      return data;
    }

    function renderCharts(data) {
      // Destroy existing chart instances if they exist
      if (precipChartInstance) precipChartInstance.destroy();
      if (tempChartInstance) tempChartInstance.destroy();
      if (ensembleChartInstance) ensembleChartInstance.destroy();

      const unit = unitSelect.value;
      const tempLabel = unit === "C" ? "Temperature (°C)" : "Temperature (°F)";

      // Chart 1: Precipitation Forecast vs Climatology
      precipChartInstance = createLineChart(
        "precipChart",
        data.forecast_data.PRECIP.dates || [],
        {
          "Forecast (Avg)": data.forecast_data.PRECIP.avg || [],
          Climatology: data.daily_climatology.PRECIP || [],
          Min: data.forecast_data.PRECIP.min || [],
          Max: data.forecast_data.PRECIP.max || [],
        },
        "Precipitation (mm)",
        ["blue", "red", "lightblue", "lightblue"],
        {
          avgTotal: (data.forecast_data.PRECIP.avg || [])
            .reduce((a, b) => a + b, 0)
            .toFixed(2),
          minTotal: (data.forecast_data.PRECIP.min || [])
            .reduce((a, b) => a + b, 0)
            .toFixed(2),
          maxTotal: (data.forecast_data.PRECIP.max || [])
            .reduce((a, b) => a + b, 0)
            .toFixed(2),
        }
      );

      // Chart 2: Temperature (Avg) Forecast vs Climatology
      tempChartInstance = createLineChart(
        "tempChart",
        data.forecast_data.TAVG.dates || [],
        {
          "Forecast (Avg)": data.forecast_data.TAVG.avg || [],
          Climatology: data.daily_climatology.TAVG || [],
          Min: data.forecast_data.TAVG.min || [],
          Max: data.forecast_data.TAVG.max || [],
        },
        tempLabel,
        ["blue", "red", "lightblue", "lightblue"]
      );

      // Chart 3: Ensemble Analysis for Precipitation Accumulation
      const sortedEnsembleTotals = (
        data.accumulation_data.ensemble_totals || []
      )
        .slice()
        .sort((a, b) => b - a);

      console.log(
        "Rendering Ensemble Analysis Chart with Data:",
        sortedEnsembleTotals
      );

      const climatologyValue =
        data.accumulation_data.accumulated_climo_precip || 0;
      const belowClimatology = sortedEnsembleTotals.filter(
        (value) => value < climatologyValue
      ).length;
      const aboveClimatology = sortedEnsembleTotals.length - belowClimatology;
      const probability =
        belowClimatology > aboveClimatology
          ? (belowClimatology / sortedEnsembleTotals.length) * 100
          : (aboveClimatology / sortedEnsembleTotals.length) * 100;
      const probabilityText =
        belowClimatology > aboveClimatology
          ? `Probability: ${probability.toFixed(
              2
            )}% chance that it will rain less than the climatology value (${climatologyValue} mm)`
          : `Probability: ${probability.toFixed(
              2
            )}% chance that it will rain more than the climatology value (${climatologyValue} mm)`;

      ensembleChartInstance = new Chart(
        document.getElementById("ensembleChart"),
        {
          type: "bar",
          data: {
            labels: Array.from(
              { length: sortedEnsembleTotals.length },
              (_, i) => `Ensemble ${i + 1}`
            ),
            datasets: [
              {
                label: "Ensemble Totals",
                data: sortedEnsembleTotals,
                backgroundColor: "gray",
              },
              {
                label: "Climatology Total",
                data: Array(sortedEnsembleTotals.length).fill(climatologyValue),
                type: "line",
                borderColor: "blue",
                borderWidth: 2,
                fill: false,
              },
            ],
          },
          options: {
            indexAxis: "x",
            scales: {
              x: {
                ticks: {
                  autoSkip: false,
                  maxRotation: 90,
                  minRotation: 90,
                },
                title: {
                  display: true,
                  text: "Ensemble Members",
                },
              },
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: "Accumulated Precipitation (mm)",
                },
              },
            },
            plugins: {
              legend: {
                display: true,
                position: "top",
              },
              tooltip: {
                callbacks: {
                  afterBody: function () {
                    return probabilityText;
                  },
                },
              },
            },
          },
        }
      );
    }

    function createLineChart(
      canvasId,
      labels,
      datasets,
      label,
      colors,
      totals = {}
    ) {
      const ctx = document.getElementById(canvasId).getContext("2d");

      const datasetArray = Object.keys(datasets).map((key, index) => {
        const dataset = {
          label: key,
          data: datasets[key],
          borderColor: colors[index],
          fill: false,
        };
        if (key === "Min" || key === "Max") {
          dataset.fill = {
            target: key === "Min" ? "Max" : "Min",
            above: "rgba(173, 216, 230, 0.4)", // lightblue shading
          };
        }
        return dataset;
      });

      console.log(`Creating Line Chart for ${canvasId} with labels:`, labels);
      console.log(`Datasets for ${canvasId}:`, datasetArray);

      return new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: datasetArray,
        },
        options: {
          scales: {
            x: {
              type: "time",
              time: {
                unit: "day",
              },
            },
            y: {
              title: {
                display: true,
                text: label,
              },
            },
          },
          plugins: {
            legend: {
              display: true,
              position: "top",
            },
            tooltip: totals.avgTotal
              ? {
                  callbacks: {
                    afterBody: function () {
                      return `Average Total: ${totals.avgTotal} mm\nMin Total: ${totals.minTotal} mm\nMax Total: ${totals.maxTotal} mm`;
                    },
                  },
                }
              : {},
          },
        },
      });
    }
  });
</script>

{% endblock %}
