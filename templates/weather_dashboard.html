{% extends "base.html" %} {% block title %}Weather Dashboard{% endblock %} {%
block content %}
<div class="dashboard">
  <div class="header">
    <h1>Weather Dashboard</h1>
    <div class="date-range">
      <input type="date" id="start-date" />
      <input type="date" id="end-date" />
      <button id="filter-date-range">Apply</button>
    </div>
    <select id="city-select">
      <option value="26.4187,-81.4173">Immokalee, FL</option>
      <option value="26.7153,-80.0534">Palm Beach County, FL</option>
      <option value="39.4802,-75.0138">Vineland, NJ</option>
      <option value="42.0086,-86.3614">Sodus, MI</option>
      <option value="25.1721,-107.4795">Sinaloa, Mexico</option>
      <option value="29.2972,-110.3309">Sonora, Mexico</option>
    </select>
    <select id="frequency-select">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
  </div>

  <div class="cards">
    <div class="card">
      <h2>Today's Forecast</h2>
      <div id="todays-forecast" class="value">Loading...</div>
      <div class="change" id="todays-change">Calculating...</div>
    </div>
    <div class="card">
      <h2>Weekly Trends</h2>
      <div id="weekly-trends" class="value">Loading...</div>
      <div class="change" id="weekly-change">Calculating...</div>
    </div>
    <div class="card">
      <h2>Monthly Outlook</h2>
      <div id="monthly-outlook" class="value">Loading...</div>
      <div class="change" id="outlook-change">Calculating...</div>
    </div>
  </div>

  <div class="graphs">
    <h2>Graphs</h2>
    <div class="chart-container">
      <div class="chart">
        <canvas id="precipChart" width="400" height="300"></canvas>
      </div>
      <div class="chart">
        <canvas id="tempChart" width="400" height="300"></canvas>
      </div>
      <div class="chart">
        <canvas id="ensembleChart" width="400" height="300"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Include Chart.js and moment.js for date formatting -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>

<script>
  let precipChartInstance = null;
  let tempChartInstance = null;
  let ensembleChartInstance = null;

  document.addEventListener("DOMContentLoaded", function () {
    const citySelect = document.getElementById("city-select");
    const frequencySelect = document.getElementById("frequency-select");
    const filterButton = document.getElementById("filter-date-range");

    citySelect.addEventListener("change", fetchData);
    frequencySelect.addEventListener("change", fetchData);
    filterButton.addEventListener("click", fetchData);

    // Initial load
    fetchData();

    function fetchData() {
      const latlon = citySelect.value.split(",");
      const frequency = frequencySelect.value;
      const startDate = document.getElementById("start-date").value;
      const endDate = document.getElementById("end-date").value;

      let apiUrl = `/api/weather_forecasts?lat=${latlon[0]}&lon=${latlon[1]}&start=${startDate}&end=${endDate}`;

      fetch(apiUrl)
        .then((response) => response.json())
        .then((data) => {
          console.log("Weather data: ", data);

          // Display forecast summary on cards
          updateSummaryCards(data);

          // Render charts using fetched data
          renderCharts(data);
        })
        .catch((error) => {
          console.error("Error fetching weather data: ", error);
        });
    }

    function updateSummaryCards(data) {
      const todaysForecast = data.forecast_data.PRECIP.avg[0];
      const weeklyTrends = data.forecast_data.PRECIP.avg
        .slice(0, 7)
        .reduce((a, b) => a + b, 0);
      const monthlyOutlook = data.forecast_data.PRECIP.avg
        .slice(0, 30)
        .reduce((a, b) => a + b, 0);

      document.getElementById(
        "todays-forecast"
      ).textContent = `${todaysForecast.toFixed(2)} mm`;
      document.getElementById(
        "weekly-trends"
      ).textContent = `${weeklyTrends.toFixed(2)} mm`;
      document.getElementById(
        "monthly-outlook"
      ).textContent = `${monthlyOutlook.toFixed(2)} mm`;
    }

    function renderCharts(data) {
      // Destroy existing chart instances if they exist
      if (precipChartInstance) precipChartInstance.destroy();
      if (tempChartInstance) tempChartInstance.destroy();
      if (ensembleChartInstance) ensembleChartInstance.destroy();

      // Chart 1: Precipitation Forecast vs Climatology
      precipChartInstance = createLineChart(
        "precipChart",
        data.forecast_data.PRECIP.dates,
        {
          "Forecast (Avg)": data.forecast_data.PRECIP.avg,
          Climatology: data.daily_climatology.PRECIP,
          Min: data.forecast_data.PRECIP.min,
          Max: data.forecast_data.PRECIP.max,
        },
        "Precipitation (mm)",
        ["blue", "red", "lightblue", "lightblue"],
        data.forecast_data.PRECIP.min,
        data.forecast_data.PRECIP.max
      );

      // Chart 2: Temperature (Avg) Forecast vs Climatology
      tempChartInstance = createLineChart(
        "tempChart",
        data.forecast_data.TAVG.dates,
        {
          "Forecast (Avg)": data.forecast_data.TAVG.avg,
          Climatology: data.daily_climatology.TAVG,
          Min: data.forecast_data.TAVG.min,
          Max: data.forecast_data.TAVG.max,
        },
        "Temperature (°C)",
        ["blue", "red", "lightblue", "lightblue"],
        data.forecast_data.TAVG.min,
        data.forecast_data.TAVG.max
      );

      // Chart 3: Ensemble Analysis for Precipitation Accumulation
      ensembleChartInstance = new Chart(
        document.getElementById("ensembleChart"),
        {
          type: "bar",
          data: {
            labels: Array.from(
              { length: data.accumulation_data.ensemble_totals.length },
              (_, i) => `Ensemble ${i + 1}`
            ),
            datasets: [
              {
                label: "Ensemble Totals",
                data: data.accumulation_data.ensemble_totals,
                backgroundColor: "gray",
              },
              {
                label: "Climatology Total",
                data: Array(data.accumulation_data.ensemble_totals.length).fill(
                  data.accumulation_data.accumulated_climo_precip
                ),
                type: "line",
                borderColor: "blue",
                fill: false,
              },
            ],
          },
          options: {
            scales: {
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: "Accumulated Precipitation (mm)",
                },
              },
            },
          },
        }
      );
    }

    function createLineChart(
      canvasId,
      labels,
      datasets,
      label,
      colors,
      minValues,
      maxValues
    ) {
      const ctx = document.getElementById(canvasId).getContext("2d");

      const datasetArray = [
        {
          label: "Min-Max Range",
          data: minValues,
          borderColor: "lightblue",
          backgroundColor: "lightblue",
          fill: "+1", // Fill between min and max
        },
        ...Object.keys(datasets).map((key, index) => ({
          label: key,
          data: datasets[key],
          borderColor: colors[index],
          fill: false,
        })),
      ];

      return new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: datasetArray,
        },
        options: {
          scales: {
            x: {
              type: "time",
              time: {
                unit: "day",
              },
            },
            y: {
              title: {
                display: true,
                text: label,
              },
            },
          },
        },
      });
    }
  });
</script>

{% endblock %}
