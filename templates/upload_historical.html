<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Historical Data</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Upload Historical Data</h1>
        <hr>

        <!-- Flash messages for success or error -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="alert alert-info" role="alert">
              {% for category, message in messages %}
                <strong>{{ message }}</strong>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Form for uploading CSV -->
        <form action="{{ url_for('upload_historical') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="commodity">Select Commodity</label>
                <select class="form-control" id="commodity" name="commodity" required>
                    <option value="">-- Select a Commodity --</option>
                    <option value="Anaheim">Anaheim</option>
                    <option value="Cubanelle">Cubanelle</option>
                    <option value="Fresno">Fresno</option>
                    <option value="Habanero">Habanero</option>
                    <option value="Hungarian Wax">Hungarian Wax</option>
                    <option value="Jalapeno">Jalapeno</option>
                    <option value="Long Hot">Long Hot</option>
                    <option value="Poblano">Poblano</option>
                    <option value="Serrano">Serrano</option>
                    <option value="Shishito">Shishito</option>
                </select>
            </div>

            <div class="form-group">
                <label for="file">Upload CSV File</label>
                <input type="file" class="form-control-file" id="file" name="file" required>
                <small class="form-text text-muted">
                    The CSV file should have the following columns: CityName, Year, Day, Price
                </small>
            </div>

            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
