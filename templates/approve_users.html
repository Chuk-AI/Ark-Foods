{% extends "base.html" %} {% block title %}Approve Users{% endblock %} {% block content %}
<h2>Approve Users</h2>
<table class="table">
  <thead>
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th>Role</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <form action="{{ url_for('approve_user', user_id=user.id) }}" method="POST">
          <button type="submit" class="btn btn-success">Approve</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
